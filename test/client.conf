# Test client for the vpynauth plugin, started by test/run.sh.
# run.sh adds --cert, --key and --auth-user-pass for each scenario.

client
dev tun
proto udp
remote 127.0.0.1 11940
nobind

ca pki/ca.crt
remote-cert-tls server

# exit on AUTH_FAILED instead of retrying
auth-retry none

disable-dco

verb 3
