# Test server for the vpynauth plugin, started by test/run.sh.
# Paths are relative to the run's work directory (--cd); run.sh adds the --plugin line.

dev tun
proto udp
local 127.0.0.1
port 11940

server 10.8.0.0 255.255.255.0
topology subnet

ca   pki/ca.crt
cert pki/server.crt
key  pki/server.key
dh   none

# data channel offload needs the ovpn-dco module and real root
disable-dco

verb 3
